<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="smartwardrobe">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>smartwardrobe</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    Pin CanvasKit to the copy that ships inside this build (build/web/canvaskit)
    instead of the https://www.gstatic.com/flutter-canvaskit CDN.

    The CDN is the default, but it means the app cannot start until ~7 MB of
    wasm has been pulled from the internet: on a slow link (or offline) the
    screen stays blank for a long time before the first frame. The local copy
    is served from the same origin, so the app boots immediately and works
    with no network at all.
  -->
  <script>
    (function () {
      var LOCAL_CANVASKIT = 'canvaskit/';
      var patch = function () {
        var loader = window._flutter && window._flutter.loader;
        if (!loader || loader.__canvasKitPinned) return false;
        var original = loader.load.bind(loader);
        loader.load = function (options) {
          options = options || {};
          options.config = options.config || {};
          if (!options.config.canvasKitBaseUrl) {
            options.config.canvasKitBaseUrl = LOCAL_CANVASKIT;
          }
          return original(options);
        };
        loader.__canvasKitPinned = true;
        return true;
      };
      // flutter_bootstrap.js is async, so the loader may not exist yet.
      if (!patch()) {
        var timer = setInterval(function () {
          if (patch()) clearInterval(timer);
        }, 10);
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
